# DRAUPNIR continuous integration.
#
# SAD 11H, in order, on a self hosted runner on ALVISS. Every stage of the
# figure exists here as its own step so that a build log names the stage that
# failed. AC-Q1: no stage is skippable on the main branch -- there is no
# `continue-on-error`, no `if:` that can switch a stage off, and the branch
# protection rule requires the `pipeline` job.
#
# The runner label falls back to ubuntu-24.04-arm so that a fork without the
# self hosted runner still gets a real build on the same architecture.

name: pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.8"
  PNPM_VERSION: "9.12.0"
  NODE_VERSION: "22"
  FORCE_COLOR: "1"

jobs:
  pipeline:
    name: SAD 11H
    runs-on: ${{ vars.DRAUPNIR_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks scans the history, not only the diff (AC-Q3).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Sync Python dependencies
        run: uv sync --all-groups --frozen

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # ==================================================================
      # 1 STATIC
      # ==================================================================
      - name: "1.1 ruff format + lint"
        run: python tasks.py lint

      - name: "1.2 mypy --strict"
        run: python tasks.py typecheck

      - name: "1.3 eslint + tsc --noEmit"
        run: python tasks.py lint-web

      - name: "1.3b import-linter (SAD 11B inward-only rule)"
        run: python tasks.py imports

      # gitleaks-action requires a paid licence for organisation-owned repos,
      # and veldris-ltd is one, so the action refused to scan at all rather
      # than scanning and finding nothing. gitleaks itself is MIT: only the
      # action wrapper is licensed. `tasks.py secrets` runs the pinned CLI
      # over the working tree and the full history, which is the gate AC-Q3
      # actually asks for, and matches how every other step here is invoked.
      - name: "1.4 secret scan (gitleaks)"
        run: python tasks.py secrets

      - name: "1.5a dependency audit"
        run: python tasks.py audit

      - name: "1.5b CycloneDX SBOM"
        run: python tasks.py sbom

      # AC-S16 calls the cryptographic inventory a build artefact, and the
      # build did not make one: `make ci` generated it, the pipeline did not,
      # and the evidence upload at the end collected an `sbom/` directory that
      # had never contained it (RF-24).
      - name: "1.5c cryptographic inventory (AC-S16)"
        run: python tasks.py crypto-inventory

      # ==================================================================
      # 2 TEST
      # ==================================================================
      - name: "2.1 unit (pytest, 90% core)"
        run: python tasks.py test-unit

      - name: "2.2 property (hypothesis, ledger and spec hashing)"
        run: python tasks.py test-property

      - name: "2.3 contract (driver conformance harness, API surface, AC-Q8 skills)"
        # tests/contract/test_skills.py runs each of the six skills of SAD 11G
        # and puts its output through the real gate, so a convention that moves
        # without its skill moving fails here rather than at a keyboard.
        run: python tasks.py test-contract

      - name: "2.4 integration (ephemeral PostgreSQL + MinIO, M1-M10, degraded modes)"
        # AC-F12 and AC-D3 are here: the procedure runs end to end against a
        # real database, and every degraded mode of SAD 11.2 is injected for
        # real -- a killed API process, a removed vault, a rewritten ledger row.
        run: python tasks.py test-integration

      - name: "2.4a acceptance evidence pack (SAD 12, AC-D1, AC-D4)"
        # The pack is generated from the specification and from the citations in
        # the repository, so a criterion that lost its last citation fails the
        # build rather than reading as covered.
        run: python tasks.py acceptance

      - name: "2.4b egress reconciliation (RF-E17)"
        # Fails when the divergence between this repository's allow list and the
        # site router's policy at VLD-INF-SINDRI-001 section 10.5 *changes* --
        # a new blocked host somebody introduced here, or a baseline entry that
        # stopped being blocked, which means the section was amended and the
        # transcription is a revision behind. It does not fail on the
        # divergence that exists today, which cannot be fixed from here.
        run: python tasks.py egress-policy

      - name: "2.5 API contract (OpenAPI diff, breaking change gate)"
        run: |
          python tasks.py openapi
          python tasks.py openapi-diff

      - name: "2.6 frontend (vitest + testing-library)"
        run: python tasks.py test-frontend

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: "2.7 e2e (Playwright, 4 journeys)"
        run: python tasks.py test-e2e

      - name: "2.8 a11y (axe on every route)"
        run: python tasks.py test-a11y

      # AC-F12's record. The integration stage proves the procedure runs; this
      # is the run whose record the evidence pack carries. It was written only
      # by somebody running `make procedure` and then committed, and a
      # committed run record is rewritten by every run (RF-31). Against the
      # stack stages 2.7 and 2.8 already brought up.
      - name: "2.8 procedure record (AC-F12, M1 to M10)"
        run: python tasks.py procedure

      - name: "2.9 visual regression (Storybook snapshots)"
        run: python tasks.py test-visual

      # ==================================================================
      # 3 BUILD
      # ==================================================================
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # The images are linux/arm64 and the runner is not. Emulation is what
      # lets stage 3.1a start one; without it the build is the only thing that
      # ever happens to an artefact that ships.
      - name: Set up qemu
        uses: docker/setup-qemu-action@v3

      # Registry credentials, on `main` only. A pull request from a fork has no
      # access to them and must still build, which is why the push below is
      # conditional rather than the build.
      - name: Sign in to the registry
        if: github.ref == 'refs/heads/main' && vars.DRAUPNIR_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DRAUPNIR_REGISTRY }}
          username: ${{ secrets.DRAUPNIR_REGISTRY_USER }}
          password: ${{ secrets.DRAUPNIR_REGISTRY_TOKEN }}

      - name: "3.1 aarch64 images (rootless, distroless base)"
        # RF-04: these were built with `--output type=cacheonly` and tagged
        # locally, and no step anywhere pushed one. `rollout.sh` then ran
        # `podman pull registry.<site>.veldris.internal/draupnir-api:<revision>`
        # against a registry that had never received an image, and
        # `draupnir-run.sh` uses `--pull=never`, so the unit could not recover
        # either. Stage 4 of SAD 11H was unrunnable.
        #
        # `--load` as well as `--push`, because stage 3.1a starts the image it
        # built and a pushed image is not a loaded one.
        env:
          REGISTRY: ${{ vars.DRAUPNIR_REGISTRY }}
        run: |
          publish=""
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ -n "${REGISTRY}" ]; then
            publish="yes"
          fi

          for target in api web; do
            tags=( --tag "draupnir-${target}:${GITHUB_SHA}" )
            if [ -n "${publish}" ]; then
              tags+=( --tag "${REGISTRY}/draupnir-${target}:${GITHUB_SHA}" )
            fi

            docker buildx build \
              --platform linux/arm64 \
              --file "docker/${target}.Dockerfile" \
              "${tags[@]}" \
              --build-arg "VERSION=0.1.0" \
              --build-arg "REVISION=${GITHUB_SHA}" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --load \
              .

            if [ -n "${publish}" ]; then
              docker push "${REGISTRY}/draupnir-${target}:${GITHUB_SHA}"
            fi
          done

          if [ -z "${publish}" ]; then
            echo "::notice::Built locally and not pushed: this is not main, or no registry is configured."
          fi

      - name: "3.1a the built image starts (RF-E23)"
        # Stage 3.1 built two images and nothing ever started one, so a
        # dependency that resolved in the checkout and not in the image was
        # invisible until deployment. That is not hypothetical: `psycopg` sat
        # in the dev group, the image built with `uv sync --no-dev`, and the
        # process would have failed inside its lifespan before the first
        # request.
        #
        # Importing the module is not the check. SQLAlchemy imports a DBAPI
        # when the engine is *created*, and both engines are created in the
        # lifespan -- so `import draupnir.api.app` would have passed on the
        # broken image. This builds them, which is the operation that failed,
        # and needs no database to do it.
        #
        # The two OIDC settings are passed because `create_app` refuses to
        # start without a way to authenticate a caller (RF-01), which is the
        # behaviour a deployment gets and so is the behaviour this should
        # exercise. `DRAUPNIR_DEV=1` would also satisfy the guard and would be
        # the wrong check: it would start the one configuration no deployment
        # runs, and the guard could then break without this noticing. The
        # values are unreachable on purpose -- nothing here fetches the
        # issuer's keys, that happens when a request arrives.
        run: |
          docker run --rm --platform linux/arm64 \
            -e DRAUPNIR_OIDC_ISSUER="https://megingjord.invalid/realms/draupnir" \
            -e DRAUPNIR_OIDC_AUDIENCE="draupnir-control-plane" \
            "draupnir-api:${GITHUB_SHA}" -c '
          from sqlalchemy import create_engine as sync_engine

          from draupnir.api.app import create_app
          from draupnir.core.infrastructure.config import get_settings
          from draupnir.core.infrastructure.database import create_engine

          create_app()
          settings = get_settings()
          create_engine()
          sync_engine(settings.database_url_sync, future=True)

          import draupnir.worker.loop

          print("api, worker and both database drivers import in the image")
          '

      - name: "3.1a the console proxy reaches the API (RF-44)"
        # The step above starts the API image alone. This starts both, on the
        # network and at the addresses `deploy/units/draupnir-run.sh` starts
        # them on, and asks the console for a path only the API can answer.
        #
        # Nothing did. The proxy's upstream was `127.0.0.1:8000`, which inside
        # the console's own container is the console, so every request the
        # console proxied answered 502 on a commissioned host -- and no test
        # started the two together to find out.
        env:
          DRAUPNIR_TAG: ${{ github.sha }}
        run: python tasks.py images-transport

      - name: "3.1b CON-A local view (S30), the wheel DVALIN installs"
        # Built here because it was built nowhere: not a workspace member, not
        # in an image, not in deploy/. VLD-INF-SINDRI-001 Procedure S12 step 10
        # puts an `xterm` on the panel instead, and the reason is that the
        # alternative had no artefact to install.
        run: python tasks.py con-a

      - name: "3.2 client regeneration (CLI + TS from OpenAPI, fails if drifted)"
        run: python tasks.py clients-check

      - name: "3.3 CycloneDX SBOM for the release"
        run: python tasks.py sbom

      - name: "3.4 sign artefacts and plug-in distributions (Decision S9, RF-02)"
        # One step, through the task (RF-24). It was two, each invoking
        # `scripts.sign_artefacts` by hand with different arguments -- the
        # second kind of drift this finding is about, between a task and a
        # workflow doing the same job.
        #
        # The SBOM was signed and no plug-in was, so `PkiVerifier` had an empty
        # signature record and refused every driver, which is why both
        # production call sites took a verifier that verifies nothing. The
        # digest is computed by the same function the verifier uses, so a
        # signer and a verifier that hashed a distribution differently fail
        # here rather than at a forge.
        #
        # A pull request from a fork cannot reach the key. On main the absence
        # is an error; elsewhere the task reports itself skipped, which is what
        # a contributor sees and is not the same as passing quietly.
        env:
          DRAUPNIR_SIGNING_KEY: ${{ secrets.DRAUPNIR_SIGNING_KEY }}
        run: |
          if [ -z "${DRAUPNIR_SIGNING_KEY}" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "::error::No signing key configured. Artefact signing is a"
            echo "::error::required stage on main (SAD 11H stage 3, Decision S9)."
            exit 1
          fi
          python tasks.py sign

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-${{ github.sha }}
          path: |
            sbom/
            dist/
            coverage.xml
            coverage-contract.xml
            coverage-integration.xml
            docs/api/openapi.json
            docs/egress-policy.md
            docs/acceptance/evidence/
            web/playwright-report/
          retention-days: 30
          if-no-files-found: warn
