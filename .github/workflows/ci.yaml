# DRAUPNIR continuous integration.
#
# SAD 11H, in order, on a self hosted runner on ALVISS. Every stage of the
# figure exists here as its own step so that a build log names the stage that
# failed. AC-Q1: no stage is skippable on the main branch -- there is no
# `continue-on-error`, no `if:` that can switch a stage off, and the branch
# protection rule requires the `pipeline` job.
#
# The runner label falls back to ubuntu-24.04-arm so that a fork without the
# self hosted runner still gets a real build on the same architecture.

name: pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.5.11"
  PNPM_VERSION: "9.12.0"
  NODE_VERSION: "22"
  FORCE_COLOR: "1"

jobs:
  pipeline:
    name: SAD 11H
    runs-on: ${{ vars.DRAUPNIR_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks scans the history, not only the diff (AC-Q3).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Sync Python dependencies
        run: uv sync --all-groups --frozen

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # ==================================================================
      # 1 STATIC
      # ==================================================================
      - name: "1.1 ruff format + lint"
        run: python tasks.py lint

      - name: "1.2 mypy --strict"
        run: python tasks.py typecheck

      - name: "1.3 eslint + tsc --noEmit"
        run: python tasks.py lint-web

      - name: "1.3b import-linter (SAD 11B inward-only rule)"
        run: python tasks.py imports

      - name: "1.4 secret scan (gitleaks)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: "1.5a dependency audit"
        run: python tasks.py audit

      - name: "1.5b CycloneDX SBOM"
        run: python tasks.py sbom

      # ==================================================================
      # 2 TEST
      # ==================================================================
      - name: "2.1 unit (pytest, 90% core)"
        run: python tasks.py test-unit

      - name: "2.2 property (hypothesis, ledger and spec hashing)"
        run: python tasks.py test-property

      - name: "2.3 contract (driver conformance harness)"
        run: python tasks.py test-contract

      - name: "2.4 integration (ephemeral PostgreSQL + MinIO)"
        run: python tasks.py test-integration

      - name: "2.5 API contract (OpenAPI diff, breaking change gate)"
        run: |
          python tasks.py openapi
          python tasks.py openapi-diff

      - name: "2.6 frontend (vitest + testing-library)"
        run: python tasks.py test-frontend

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: "2.7 e2e (Playwright, 4 journeys)"
        run: python tasks.py test-e2e

      - name: "2.8 a11y (axe on every route)"
        run: python tasks.py test-a11y

      - name: "2.9 visual regression (Storybook snapshots)"
        run: python tasks.py test-visual

      # ==================================================================
      # 3 BUILD
      # ==================================================================
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: "3.1 aarch64 images (rootless, distroless base)"
        run: |
          for target in api web; do
            docker buildx build \
              --platform linux/arm64 \
              --file "docker/${target}.Dockerfile" \
              --tag "draupnir-${target}:${GITHUB_SHA}" \
              --build-arg "VERSION=0.1.0" \
              --build-arg "REVISION=${GITHUB_SHA}" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --output type=cacheonly \
              .
          done

      - name: "3.2 client regeneration (CLI + TS from OpenAPI, fails if drifted)"
        run: python tasks.py clients-check

      - name: "3.3 CycloneDX SBOM for the release"
        run: python tasks.py sbom

      - name: "3.4 sign artefacts (internal PKI)"
        env:
          DRAUPNIR_SIGNING_KEY: ${{ secrets.DRAUPNIR_SIGNING_KEY }}
        run: |
          if [ -z "${DRAUPNIR_SIGNING_KEY}" ]; then
            echo "::error::No signing key configured. Artefact signing is a"
            echo "::error::required stage on main (SAD 11H stage 3, Decision S9)."
            # A pull request from a fork cannot reach the key. Signing runs on
            # main, where the key is present, and the absence is reported
            # rather than silently skipped.
            [ "${GITHUB_REF}" = "refs/heads/main" ] && exit 1
            echo "signing key unavailable outside main; stage reported, not skipped"
            exit 0
          fi
          python scripts/sign_artefacts.py --sbom-dir sbom

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-${{ github.sha }}
          path: |
            sbom/
            coverage.xml
            docs/api/openapi.json
            web/playwright-report/
          retention-days: 30
          if-no-files-found: warn
