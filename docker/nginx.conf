# The console, and the reverse proxy in front of the API. RF-03, RF-37.
#
# These used to be two origins with nothing joining them: the console was
# published on 127.0.0.1:8080, the API on 127.0.0.1:8000, and the API client
# calls same-origin with an empty base URL. So a console request to `/v1/runs`
# reached `location /`, matched `try_files ... /index.html`, and was answered
# with the SPA's own HTML — a 200 carrying a document where JSON was expected.
# The header of this file said "the API is reached through the reverse proxy in
# front of both", and there was no such proxy.
#
# RF-37. Then both hops were plain HTTP. SAD 9.5 is "TLS 1.3 only", with mTLS
# between control plane components, so now:
# - the browser's hop terminates here, TLS 1.3 and nothing else, with the
#   certificate `install.sh --check` requires;
# - the hop to the API is TLS 1.3 too, the API's certificate is verified
#   against the internal CA, and this proxy presents its own certificate,
#   which the API requires.
#
# The material is mounted read-only at /etc/draupnir/tls by
# deploy/units/draupnir-run.sh, under the names below. A missing file stops
# nginx at start, and that is the refusal: there is no plain HTTP listener to
# fall back to. The cryptographic inventory's TLS row is derived from this file
# (`draupnir.svalinn.transport.declared_by`), so it reports TLS 1.3 in use
# because this configuration terminates it, and for no other reason.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Where the API is. A variable rather than a literal in each `proxy_pass`,
    # so the units can be addressed differently without four edits that have to
    # agree.
    map $host $draupnir_api {
        default "https://127.0.0.1:8000";
    }

    # The hop to the API. TLS 1.3 only, the API's certificate verified against
    # the internal CA under the name it carries, and this proxy's own
    # certificate presented: the API refuses a connection without one.
    proxy_ssl_certificate         /etc/draupnir/tls/proxy-client.pem;
    proxy_ssl_certificate_key     /etc/draupnir/tls/proxy-client.key;
    proxy_ssl_trusted_certificate /etc/draupnir/tls/internal-ca.pem;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_protocols           TLSv1.3;
    proxy_ssl_name                draupnir-api;
    proxy_ssl_session_reuse       on;

    server {
        listen 8443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # TLS 1.3 only. Named, because nginx's default admits TLS 1.2.
        ssl_protocols       TLSv1.3;
        ssl_certificate     /etc/draupnir/tls/server.pem;
        ssl_certificate_key /etc/draupnir/tls/server.key;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # The console is a built SPA with hashed assets and no inline script,
        # so it needs neither `unsafe-inline` nor `unsafe-eval`. `connect-src`
        # is `self` because the API is same-origin through this proxy — which
        # is the point of the proxy — and `frame-ancestors none` says the same
        # thing as X-Frame-Options to a browser that reads CSP instead.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Two years, subdomains included, and preload-eligible. TLS is
        # terminated here (RF-37), and the header would belong to the response
        # even if it were not: a terminator swapped for another must not take
        # it away.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Hashed assets are immutable; the entry document never is.
        #
        # `expires`, not `add_header`, and that is the point. A location with an
        # `add_header` of its own inherits none of the server's, so every asset
        # and the console's own document were served without HSTS, the content
        # security policy or X-Frame-Options -- which nothing noticed until
        # RF-37 started this proxy and asked it for a page. `expires` sets
        # Cache-Control without replacing them.
        location /assets/ {
            expires 1y;
        }

        # -- the API, same-origin -------------------------------------------
        location /v1/ {
            proxy_pass $draupnir_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;
        }

        # The event streams. `proxy_buffering off` because a buffered SSE
        # response arrives in one lump when the connection closes, which for a
        # stream is never — the console would show an empty run board and no
        # error. The read timeout is a day for the same reason: nginx's default
        # sixty seconds would sever an idle stream every minute, and the
        # reconnect logic would hide it as a flicker rather than a fault.
        location ~ ^/v1/(events|runs/[^/]+/events)$ {
            proxy_pass $draupnir_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header Connection        "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding off;
        }

        # The authorisation-code flow. Unversioned because a browser redirect
        # is not part of the `/v1` contract and its URLs are registered with
        # the identity provider, where a version in the path would be a second
        # thing to change on every release.
        location /auth/ {
            proxy_pass $draupnir_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /openapi.json {
            proxy_pass $draupnir_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Operator probes. Unversioned by design (see routers/health.py).
        location = /healthz {
            proxy_pass $draupnir_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /readyz {
            proxy_pass $draupnir_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # `/metrics` is deliberately NOT proxied, and this comment is the
        # control. SAD 8.1 lists it unauthenticated *on loopback only*, and
        # `routers/health.py` justifies carrying no credential on exactly that
        # ground: the binding is the control. Proxying it here would publish it
        # on whatever this server is reachable from and retire that
        # justification silently — the endpoint would still say it needs no
        # credential, and it would no longer be true.
        #
        # Prometheus scrapes it directly from the host (VLD-INF-SINDRI-001
        # section 34 step 7, and amendment 2e), with a packet filter rule
        # limiting the port to REGIN. That is the published path.
        location = /metrics {
            return 404;
        }

        # `expires epoch` is `Cache-Control: no-cache`, set without an
        # `add_header` that would drop the server's headers. See `/assets/`.
        location / {
            try_files $uri $uri/ /index.html;
            expires epoch;
        }
    }
}
