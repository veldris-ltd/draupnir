# The slurmrestd ScheduleDriver of SAD 8.2.
#
# A separate distribution, like every driver, and a sibling of
# `veldris-draupnir-slurm`: the same interface reached a different way. Neither
# imports the other -- they are two installations of one contract, and the
# `drivers-depend-on-interfaces-only` contract forbids either from reaching
# into draupnir.motsognir for the placement policy that is not theirs.

[project]
name = "veldris-draupnir-slurmrest"
version = "1.0.0"
description = "Slurm ScheduleDriver for DRAUPNIR, over slurmrestd"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
# httpx because this speaks HTTP and the shim speaks subprocess. The caller may
# inject its own client -- that is how an outbound call reaches SVALINN's
# egress broker -- and this is the default for a development machine.
dependencies = ["veldris-draupnir", "httpx>=0.28"]

[tool.uv.sources]
veldris-draupnir = { workspace = true }

[project.entry-points."draupnir.schedule"]
"motsognir.slurmrest/v1" = "draupnir_motsognir_slurmrest:driver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["draupnir_motsognir_slurmrest"]
artifacts = ["draupnir_motsognir_slurmrest/py.typed"]
