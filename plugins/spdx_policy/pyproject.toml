# AC-D2: "Every plug-in interface has a reference implementation and a worked
# example." This is `draupnir.policy`'s, and SAD 10.2's worked extension
# scenario -- a jurisdiction whose regime differs arrives as a policy driver
# rather than as a change to the core.

[project]
name = "veldris-draupnir-spdx-policy"
version = "1.0.0"
description = "Reference PolicyDriver for DRAUPNIR: licence decisions from SPDX identifiers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = ["veldris-draupnir"]

[tool.uv.sources]
veldris-draupnir = { workspace = true }

[project.entry-points."draupnir.policy"]
"gleipnir.spdx/v1" = "draupnir_spdx_policy:driver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["draupnir_spdx_policy"]
artifacts = ["draupnir_spdx_policy/py.typed"]
