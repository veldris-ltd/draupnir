# A first party driver. Separate distribution, discovered by entry point, and
# forbidden by import contract from reaching into any DRAUPNIR module.

[project]
name = "veldris-draupnir-lmeval"
version = "1.0.0"
description = "lm-evaluation-harness EvalDriver for DRAUPNIR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = ["veldris-draupnir"]

[tool.uv.sources]
veldris-draupnir = { workspace = true }

[project.entry-points."draupnir.eval"]
"raun.lmeval/v1" = "draupnir_raun_lmeval:driver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["draupnir_raun_lmeval"]
